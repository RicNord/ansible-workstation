#cloud-config
packages:
- git
- base-devel
- archlinux-keyring
- linux
- linux-firmware
- networkmanager
runcmd:
- pacman -Rdd --noconfirm vim
- pacman -S --noconfirm --needed gvim
timezone: Europe/Stockholm
